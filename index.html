<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Harian</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        input { padding: 8px; width: 70%; }
        button { padding: 8px 12px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { background: #f4f4f4; margin-bottom: 8px; padding: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>Daftar Tugas</h2>
    <div>
        <input type="text" id="inputTugas" placeholder="Tulis tugas baru...">
        <button id="btnTambah">Tambah</button>
    </div>

    <ul id="daftarTugas"></ul>

    <!-- Menghubungkan file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
